apiVersion: 1
# Stable UIDs keep provisioned dashboards independent of local datasource IDs.
datasources:
  - name: Pico Prometheus
    uid: pico-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      timeInterval: 10s
  - name: Pico PostgreSQL
    uid: pico-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: $GRAFANA_DB_USER
    editable: false
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: $PG_DB
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
      maxOpenConns: 3
      maxIdleConns: 1
      timeInterval: 10s
