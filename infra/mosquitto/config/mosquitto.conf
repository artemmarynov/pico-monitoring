listener 1883
protocol mqtt
allow_anonymous false
password_file /run/pico-mqtt/passwd
acl_file /run/pico-mqtt/acl

# Public inbound bridge: accepted risk of spoofing and disclosure.
connection bridge_from_public
address test.mosquitto.org:1883
start_type automatic
restart_timeout 5 30
cleansession true
try_private false
notifications false
topic __MQTT_TOPIC__ in 0
