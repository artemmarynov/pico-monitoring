[tool.pytest.ini_options]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["firmware/lib", "backend/.venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
